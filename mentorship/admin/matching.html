<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspire Mentorship | Mentor Matching</title>
  <meta name="description" content="Pair approved mentors with mentees.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/mentorship/css/mentorship.css">
  <style>
    body.admin-body {
      background: var(--mentorship-navy);
      color: #F5F1EA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .admin-wrap { max-width: 720px; margin: 0 auto }
    .admin-section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--mentorship-gold); margin: 28px 0 12px }
    .admin-section-title:first-of-type { margin-top: 0 }
    .admin-app-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 12px;
    }
    .admin-app-name { font-weight: 700; font-size: 15px }
    .admin-app-email { font-size: 12px; opacity: .6 }
    .admin-btn { padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 700 }
    .admin-btn-approve { background: var(--mentorship-gold); color: #fff }
    .admin-btn-approve:hover { opacity: .9 }
    .admin-btn-reject { background: transparent; border: 1px solid rgba(255,255,255,.15); color: rgba(245,241,234,.8) }
    .admin-btn-reject:hover { border-color: rgba(239,68,68,.5); color: #fca5a5 }
    .admin-btn:disabled { opacity: .5 }
    .assign-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
    .assign-row select {
      flex: 1; min-width: 180px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.13);
      border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #F5F1EA; font-family: inherit;
    }
    .assign-arrow { opacity: .4; font-size: 16px }
    .closure-form { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 10px; }
    .closure-form select, .closure-form input[type="text"] {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #F5F1EA; font-family: inherit;
    }
    .closure-form label { font-size: 12px; display: flex; align-items: center; gap: 6px; color: rgba(245,241,234,.8); }
    .closure-form-actions { display: flex; gap: 8px }
    .closure-form-actions .admin-btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,.15); color: rgba(245,241,234,.7) }
    .match-context { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
    .match-context-col { font-size: 12px; color: rgba(245,241,234,.75); line-height: 1.55 }
    .match-context-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: rgba(245,241,234,.45); margin-bottom: 6px }
    .match-context-empty { opacity: .5; font-style: italic }
    .match-chip { display: inline-block; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px 9px; font-size: 11px; margin: 0 4px 4px 0 }
    .match-caseload { font-weight: 700 }
    .match-caseload.busy { color: #fbbf24 }
  </style>
</head>
<body class="admin-body">
  <div class="admin-wrap">
    <div class="page-header">
      <div>
        <div class="page-eyebrow">Admin</div>
        <h1 class="page-title">Mentor Matching</h1>
      </div>
      <button class="admin-signout-btn" id="adminSignOutBtn">Sign out</button>
    </div>
    <div id="content">
      <div class="empty-state"><div class="empty-state-icon">⏳</div>Checking access…</div>
    </div>
  </div>

  <script src="/assets/supabase.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
    let sessionToken = null;
    let latestData = null;
    const HEALTH_LABEL = { green: 'Active', amber: 'Quiet', red: 'At risk' };
    const CLOSURE_REASONS = [
      ['completed_term', 'Completed the commitment term'],
      ['mentee_moved', 'Mentee moved on / left the programme'],
      ['mentor_stepped_down', 'Mentor stepped down'],
      ['not_a_good_fit', "Wasn't a good fit"],
      ['safeguarding_concern', 'Safeguarding concern'],
      ['other', 'Other'],
    ];
    // Labels for the onboarding profile fields surfaced as matching
    // context below — mirrors the option/chip values set in
    // onboarding/know-me.html and onboarding/life-wheel.html exactly.
    const REASON_LABELS = {
      confidence: 'Building confidence', direction: 'Finding direction / purpose',
      someone_to_talk_to: 'Someone to talk to', faith: 'Growing in faith',
      academic: 'Academic and life balance', all: 'A bit of everything',
    };
    const LIFE_WHEEL_LABELS = { spiritual: 'Spiritual', intellectual: 'Intellectual', physical: 'Physical', social: 'Social', emotional: 'Emotional', character: 'Character' };
    const titleCase = s => s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

    function menteeContext(m) {
      if (!m) return '<div class="match-context-empty">No mentee selected.</div>';
      const parts = [];
      if (m.mentorship_reason && REASON_LABELS[m.mentorship_reason]) parts.push(`<div>Looking for: ${REASON_LABELS[m.mentorship_reason]}</div>`);
      if (m.strengths?.length) parts.push(`<div>${m.strengths.map(s => `<span class="match-chip">${escapeHtml(titleCase(s))}</span>`).join('')}</div>`);
      if (m.life_wheel) {
        const lowest = Object.entries(m.life_wheel).filter(([k]) => LIFE_WHEEL_LABELS[k]).sort((a, b) => a[1] - b[1]).slice(0, 2);
        if (lowest.length) parts.push(`<div>Lowest self-rated areas: ${lowest.map(([k, v]) => `${LIFE_WHEEL_LABELS[k]} (${v}/10)`).join(', ')}</div>`);
      }
      if (m.about_me) parts.push(`<div style="margin-top:6px">"${escapeHtml(m.about_me.length > 160 ? m.about_me.slice(0, 160) + '…' : m.about_me)}" — in their own words</div>`);
      return parts.length ? parts.join('') : '<div class="match-context-empty">No onboarding profile shared yet.</div>';
    }

    function mentorContext(m) {
      if (!m) return '<div class="match-context-empty">No mentor selected.</div>';
      const parts = [];
      const busy = m.active_caseload >= 3;
      parts.push(`<div>Current mentees: <span class="match-caseload${busy ? ' busy' : ''}">${m.active_caseload}</span>${busy ? ' — already carrying a full caseload' : ''}</div>`);
      if (m.motivation) parts.push(`<div style="margin-top:6px">"${escapeHtml(m.motivation.length > 160 ? m.motivation.slice(0, 160) + '…' : m.motivation)}"</div>`);
      return parts.join('');
    }

    // See admin/index.html for why this button was added to every admin page.
    $('adminSignOutBtn')?.addEventListener('click', async () => {
      const db = await getDB();
      await db.auth.signOut();
      window.location.href = '/mentorship/login.html';
    });

    async function callAdminFn(body) {
      const res = await fetch('/.netlify/functions/admin-matching', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      return { status: res.status, data };
    }

    function render(data) {
      latestData = data;
      const { mentors, unassignedMentees, activeAssignments } = data;
      const content = $('content');

      const assignSection = `
        <div class="admin-section-title">Assign a Mentee</div>
        ${(!mentors.length || !unassignedMentees.length)
          ? `<div class="empty-state" style="padding:24px 20px">
               <div class="empty-state-icon">🤝</div>
               ${!mentors.length ? 'No approved mentors yet.' : 'Every mentee currently has a mentor.'}
             </div>`
          : `<div class="admin-app-card">
               <div class="assign-row">
                 <select id="mentorSelect">${mentors.map(m => `<option value="${m.id}">${escapeHtml(m.full_name || m.email)}${m.active_caseload ? ` (${m.active_caseload} active)` : ''}</option>`).join('')}</select>
                 <span class="assign-arrow">→</span>
                 <select id="menteeSelect">${unassignedMentees.map(m => {
                   const flag = m.is_minor && m.guardian_consent_status !== 'confirmed' ? ' — ⚠️ guardian consent pending' : '';
                   return `<option value="${m.id}">${escapeHtml(m.full_name || m.email)}${flag}</option>`;
                 }).join('')}</select>
                 <button class="admin-btn admin-btn-approve" id="assignBtn">Assign</button>
               </div>
               <div class="match-context" id="matchContext">
                 <div class="match-context-col"><div class="match-context-label">Mentor</div><div id="mentorContextBody"></div></div>
                 <div class="match-context-col"><div class="match-context-label">Mentee</div><div id="menteeContextBody"></div></div>
               </div>
             </div>`
        }`;

      const activeSection = `
        <div class="admin-section-title">Active Pairings</div>
        ${!activeAssignments.length
          ? `<div class="empty-state" style="padding:24px 20px"><div class="empty-state-icon">📋</div>No active pairings yet.</div>`
          : activeAssignments.map(a => `
              <div class="admin-app-card" data-id="${a.id}">
                <div class="assign-row" style="justify-content:space-between">
                  <div>
                    <div class="admin-app-name">${escapeHtml(a.mentor_name)} → ${escapeHtml(a.student_name)}</div>
                    <div class="admin-app-email">
                      Paired ${new Date(a.assigned_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}
                      · <span class="health-badge health-${a.health}">${HEALTH_LABEL[a.health] || a.health}</span>
                      ${a.commitment_acknowledged_at ? '' : ' · <span class="health-badge" style="background:rgba(255,255,255,.08);color:rgba(245,241,234,.6)">Commitment not yet acknowledged</span>'}
                    </div>
                  </div>
                  <button class="admin-btn admin-btn-reject" data-action="toggleEnd">End Pairing</button>
                </div>
                <div class="closure-form" style="display:none">
                  <select class="closure-reason">
                    <option value="" disabled selected>Why is this pairing ending?</option>
                    ${CLOSURE_REASONS.map(([v, label]) => `<option value="${v}">${label}</option>`).join('')}
                  </select>
                  <label><input type="checkbox" class="closure-meeting"> A closure conversation/meeting was held</label>
                  <input type="text" class="closure-notes" placeholder="Notes (optional)">
                  <div class="closure-form-actions">
                    <button class="admin-btn admin-btn-reject" data-action="confirmEnd">Confirm End Pairing</button>
                    <button class="admin-btn admin-btn-cancel" data-action="cancelEnd">Cancel</button>
                  </div>
                </div>
              </div>`).join('')
        }`;

      content.innerHTML = assignSection + activeSection;
      refreshMatchContext();
    }

    function refreshMatchContext() {
      if (!latestData || !$('matchContext')) return;
      const mentor = latestData.mentors.find(m => m.id === $('mentorSelect')?.value);
      const mentee = latestData.unassignedMentees.find(m => m.id === $('menteeSelect')?.value);
      $('mentorContextBody').innerHTML = mentorContext(mentor);
      $('menteeContextBody').innerHTML = menteeContext(mentee);
    }

    async function reload() {
      const { status, data } = await callAdminFn({ action: 'list' });
      if (status === 401) { window.location.href = '/mentorship/login.html'; return; }
      if (status === 403) {
        $('content').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔒</div>You\'re not authorized to view this page.</div>';
        return;
      }
      if (status !== 200) {
        $('content').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div>${escapeHtml(data.error || 'Something went wrong loading matching data.')}</div>`;
        return;
      }
      render(data);
    }

    (async () => {
      const content = $('content');
      try {
        const db = await getDB();
        const { data: { session } } = await db.auth.getSession();
        if (!session) { window.location.href = '/mentorship/login.html'; return; }
        sessionToken = session.access_token;

        await reload();

        content.addEventListener('change', (e) => {
          if (e.target.id === 'mentorSelect' || e.target.id === 'menteeSelect') refreshMatchContext();
        });
        content.addEventListener('click', async (e) => {
          const assignBtn = e.target.closest('#assignBtn');
          if (assignBtn) {
            const mentorId = $('mentorSelect').value;
            const studentId = $('menteeSelect').value;
            assignBtn.disabled = true; assignBtn.textContent = 'Assigning…';
            const { status, data } = await callAdminFn({ action: 'assign', mentorId, studentId });
            if (status !== 200) {
              alert(data.error || 'Could not create this pairing — please try again.');
              assignBtn.disabled = false; assignBtn.textContent = 'Assign';
              return;
            }
            await reload();
            return;
          }
          const toggleBtn = e.target.closest('button[data-action="toggleEnd"]');
          if (toggleBtn) {
            const form = toggleBtn.closest('.admin-app-card').querySelector('.closure-form');
            form.style.display = form.style.display === 'none' ? '' : 'none';
            return;
          }
          const cancelBtn = e.target.closest('button[data-action="cancelEnd"]');
          if (cancelBtn) {
            cancelBtn.closest('.closure-form').style.display = 'none';
            return;
          }
          const confirmBtn = e.target.closest('button[data-action="confirmEnd"]');
          if (confirmBtn) {
            const card = confirmBtn.closest('.admin-app-card');
            const assignmentId = card.dataset.id;
            const closureReason = card.querySelector('.closure-reason').value;
            if (!closureReason) {
              alert('Please choose a reason before ending this pairing.');
              return;
            }
            const closureMeetingHeld = card.querySelector('.closure-meeting').checked;
            const closureNotes = card.querySelector('.closure-notes').value.trim();
            confirmBtn.disabled = true; confirmBtn.textContent = 'Ending…';
            const { status, data } = await callAdminFn({ action: 'end', assignmentId, closureReason, closureMeetingHeld, closureNotes });
            if (status !== 200) {
              alert(data.error || 'Could not end this pairing — please try again.');
              confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm End Pairing';
              return;
            }
            await reload();
          }
        });
      } catch (e) {
        console.warn('Matching page failed:', e);
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div>Something went wrong — please try again.</div>';
      }
    })();
  </script>
</body>
</html>
