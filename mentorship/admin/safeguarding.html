<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspire Mentorship | Safeguarding Queue</title>
  <meta name="description" content="Review Ask for Help and Prayer & Support submissions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/mentorship/css/mentorship.css">
  <style>
    body.admin-body {
      background: var(--mentorship-navy);
      color: #F5F1EA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .admin-wrap { max-width: 760px; margin: 0 auto }
    .sg-filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .sg-filter-btn {
      padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: rgba(245,241,234,.75);
      cursor: pointer;
    }
    .sg-filter-btn.active { background: var(--mentorship-gold); color: #fff; border-color: var(--mentorship-gold); }
    .sg-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 20px 22px;
      margin-bottom: 14px;
    }
    .sg-card.urgent { border-color: rgba(239,68,68,.5); }
    .sg-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px }
    .sg-name { font-weight: 700; font-size: 15px }
    .sg-email { font-size: 12px; opacity: .6 }
    .sg-badges { display: flex; gap: 6px; flex-shrink: 0; }
    .sg-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
    .sg-badge-urgent { background: rgba(239,68,68,.18); color: #fca5a5; }
    .sg-badge-prayer { background: rgba(168,133,26,.18); color: var(--mentorship-gold); }
    .sg-badge-general { background: rgba(255,255,255,.08); color: rgba(245,241,234,.7); }
    .sg-badge-status-new { background: rgba(59,130,246,.18); color: #93c5fd; }
    .sg-badge-status-seen { background: rgba(255,255,255,.08); color: rgba(245,241,234,.6); }
    .sg-badge-status-resolved { background: rgba(34,197,94,.15); color: #86efac; }
    .sg-message { font-size: 13px; opacity: .85; line-height: 1.55; margin-bottom: 14px; white-space: pre-wrap }
    .sg-meta { font-size: 12px; opacity: .5; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sg-stale { color: #fca5a5; opacity: 1; font-weight: 700; }
    .sg-claim { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.06); }
    .sg-claim.mine { background: rgba(184,92,26,.18); color: var(--mentorship-gold); }
    .sg-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .sg-btn { flex: 1; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 700; background: transparent; border: 1px solid rgba(255,255,255,.15); color: rgba(245,241,234,.8); cursor: pointer; min-width: 100px; }
    .sg-btn:hover { border-color: var(--mentorship-gold); color: var(--mentorship-gold); }
    .sg-btn:disabled { opacity: .5; cursor: default; }
    .sg-reply-block { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
    .sg-reply-existing { background: rgba(184,92,26,.08); border: 1px solid rgba(184,92,26,.22); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; line-height: 1.5; }
    .sg-reply-existing b { color: var(--mentorship-gold); }
    .sg-reply-form { display: flex; gap: 8px; flex-wrap: wrap; }
    .sg-reply-input {
      flex: 1; min-width: 200px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit; color: #F5F1EA; resize: vertical; min-height: 42px;
    }
  </style>
</head>
<body class="admin-body">
  <div class="admin-wrap">
    <div class="page-header">
      <div>
        <div class="page-eyebrow">Admin · Safeguarding</div>
        <h1 class="page-title">Ask for Help / Prayer & Support</h1>
      </div>
      <button class="admin-signout-btn" id="adminSignOutBtn">Sign out</button>
    </div>
    <div class="sg-filters" id="filters">
      <button class="sg-filter-btn active" data-filter="all">All</button>
      <button class="sg-filter-btn" data-filter="new">New</button>
      <button class="sg-filter-btn" data-filter="seen">Seen</button>
      <button class="sg-filter-btn" data-filter="resolved">Resolved</button>
    </div>
    <div id="content">
      <div class="empty-state"><div class="empty-state-icon">⏳</div>Checking access…</div>
    </div>
  </div>

  <script src="/assets/supabase.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
    const CATEGORY_BADGE = { urgent: 'sg-badge-urgent', prayer: 'sg-badge-prayer', general: 'sg-badge-general' };
    const CATEGORY_LABEL = { urgent: 'Urgent', prayer: 'Prayer', general: 'Support' };

    let allRequests = [];
    let currentFilter = 'all';
    let session = null;

    // See admin/index.html for why this button was added to every admin page.
    $('adminSignOutBtn')?.addEventListener('click', async () => {
      const db = await getDB();
      await db.auth.signOut();
      window.location.href = '/mentorship/login.html';
    });

    function renderRequests() {
      const content = $('content');
      const rows = currentFilter === 'all' ? allRequests : allRequests.filter(r => r.status === currentFilter);
      if (!rows.length) {
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎉</div>Nothing here right now.</div>';
        return;
      }
      content.innerHTML = rows.map(r => {
        const date = new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
        const name = r.student?.full_name || 'No name on record';
        const email = r.student?.email || 'unknown';
        const nextActions = { new: ['seen', 'resolved'], seen: ['resolved'], resolved: [] }[r.status] || [];
        const actionLabel = { seen: 'Mark Seen', resolved: 'Mark Resolved' };

        // Staleness: how long an unresolved request has been open — the
        // audit flagged that a 4-day-old request looked identical to one
        // from 4 minutes ago. Threshold of 1 day is deliberately tight
        // given this queue's subject matter.
        const daysOpen = Math.floor((Date.now() - new Date(r.created_at).getTime()) / 86400000);
        const staleNote = r.status !== 'resolved' && daysOpen >= 1
          ? `<span class="sg-stale">Open ${daysOpen} day${daysOpen === 1 ? '' : 's'}</span>` : '';

        const claim = r.response?.claimed_by
          ? `<span class="sg-claim${r.response.claimed_by === session.user.id ? ' mine' : ''}">Claimed by ${escapeHtml(r.response.claimed_by === session.user.id ? 'you' : r.response.claimed_by_name)}</span>`
          : `<button class="sg-btn" data-claim-btn style="flex:0 1 auto; min-width:0; padding:3px 12px; font-size:12px">Claim</button>`;

        const existingReply = r.response?.reply_message
          ? `<div class="sg-reply-existing"><b>Sent to student</b> — ${escapeHtml(r.response.reply_message)}<br>&mdash; ${escapeHtml(r.response.replied_by_name)}, ${new Date(r.response.replied_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</div>`
          : '';

        return `
          <div class="sg-card ${r.category === 'urgent' ? 'urgent' : ''}" data-id="${r.id}">
            <div class="sg-top">
              <div>
                <div class="sg-name">${escapeHtml(name)}</div>
                <div class="sg-email">${escapeHtml(email)}</div>
              </div>
              <div class="sg-badges">
                <span class="sg-badge ${CATEGORY_BADGE[r.category] || 'sg-badge-general'}">${CATEGORY_LABEL[r.category] || 'Support'}</span>
                <span class="sg-badge sg-badge-status-${r.status}">${r.status}</span>
              </div>
            </div>
            <div class="sg-message">${escapeHtml(r.message)}</div>
            <div class="sg-meta">${date} ${staleNote} ${claim}</div>
            ${nextActions.length ? `<div class="sg-actions">${nextActions.map(a => `<button class="sg-btn" data-action="${a}">${actionLabel[a]}</button>`).join('')}</div>` : ''}
            <div class="sg-reply-block">
              ${existingReply}
              <div class="sg-reply-form">
                <textarea class="sg-reply-input" data-reply-input placeholder="${r.response?.reply_message ? 'Send an updated reply…' : 'Reply to the student — they will see this in Prayer & Support…'}"></textarea>
                <button class="sg-btn" data-reply-btn style="flex:0 1 auto">Send Reply</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    async function callAdminFn(body) {
      const res = await fetch('/.netlify/functions/admin-help-requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      return { status: res.status, data };
    }

    $('filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.sg-filter-btn');
      if (!btn) return;
      $('filters').querySelectorAll('.sg-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderRequests();
    });

    (async () => {
      const content = $('content');
      try {
        const db = await getDB();
        const { data: { session: s } } = await db.auth.getSession();
        if (!s) { window.location.href = '/mentorship/login.html'; return; }
        session = s;

        const { status, data } = await callAdminFn({ action: 'list' });
        if (status === 401) { window.location.href = '/mentorship/login.html'; return; }
        if (status === 403) {
          content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔒</div>You\'re not authorized to view this page.</div>';
          return;
        }
        if (status !== 200) {
          content.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div>${escapeHtml(data.error || 'Something went wrong loading requests.')}</div>`;
          return;
        }
        allRequests = data.requests || [];
        renderRequests();

        content.addEventListener('click', async (e) => {
          const statusBtn = e.target.closest('button[data-action]');
          const claimBtn = e.target.closest('button[data-claim-btn]');
          const replyBtn = e.target.closest('button[data-reply-btn]');
          if (!statusBtn && !claimBtn && !replyBtn) return;
          const card = (statusBtn || claimBtn || replyBtn).closest('.sg-card');
          const requestId = card.dataset.id;

          if (statusBtn) {
            const newStatus = statusBtn.dataset.action;
            card.querySelectorAll('button').forEach(b => b.disabled = true);
            const { status: s2, data: d2 } = await callAdminFn({ action: 'update-status', requestId, status: newStatus });
            if (s2 !== 200) {
              alert(d2.error || 'Could not update this request — please try again.');
              card.querySelectorAll('button').forEach(b => b.disabled = false);
              return;
            }
            const row = allRequests.find(r => r.id === requestId);
            if (row) row.status = newStatus;
            renderRequests();
            return;
          }

          if (claimBtn) {
            claimBtn.disabled = true;
            const { status: s2, data: d2 } = await callAdminFn({ action: 'claim', requestId });
            if (s2 !== 200) {
              alert(d2.error || 'Could not claim this request — please try again.');
              claimBtn.disabled = false;
              return;
            }
            const row = allRequests.find(r => r.id === requestId);
            if (row) {
              row.response = row.response || {};
              row.response.claimed_by = session.user.id;
              row.response.claimed_by_name = session.user.user_metadata?.full_name || session.user.email;
            }
            renderRequests();
            return;
          }

          if (replyBtn) {
            const textarea = card.querySelector('[data-reply-input]');
            const replyMessage = textarea.value.trim();
            if (!replyMessage) { textarea.focus(); return; }
            replyBtn.disabled = true; replyBtn.textContent = 'Sending…';
            const { status: s2, data: d2 } = await callAdminFn({ action: 'reply', requestId, replyMessage });
            if (s2 !== 200) {
              alert(d2.error || 'Could not send this reply — please try again.');
              replyBtn.disabled = false; replyBtn.textContent = 'Send Reply';
              return;
            }
            const row = allRequests.find(r => r.id === requestId);
            if (row) {
              row.response = row.response || {};
              row.response.reply_message = replyMessage;
              row.response.replied_by_name = session.user.user_metadata?.full_name || session.user.email;
              row.response.replied_at = new Date().toISOString();
              if (row.status === 'new') row.status = 'seen';
            }
            renderRequests();
          }
        });
      } catch (e) {
        console.warn('Safeguarding page failed:', e);
        content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div>Something went wrong — please try again.</div>';
      }
    })();
  </script>
</body>
</html>
