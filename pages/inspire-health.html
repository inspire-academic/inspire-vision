<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspire Health & Wellbeing | Inspire Vision</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <style>
    /* Design-preview placeholder only — this page renders a flat mockup
       image, not real markup. Swap for a built page when Health &
       Wellbeing moves past the concept stage. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .preview-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.7rem 1.25rem;
      background: var(--clr-navy);
      color: rgba(255,255,255,0.92);
      font-size: 0.82rem;
    }
    .preview-bar strong { color: var(--clr-gold-light, #F0C842); }
    .preview-bar a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s;
    }
    .preview-bar a:hover { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.08); }
    .preview-figure {
      margin: 0;
      max-width: 960px;
      margin: 0 auto;
    }
    .preview-figure img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="preview-bar">
    <span><strong>Design preview</strong> — Inspire Health &amp; Wellbeing is still in development. What you're seeing is a concept mockup, not a live site.</span>
    <a href="../index.html">&larr; Back to Inspire Vision</a>
  </div>
  <figure class="preview-figure">
    <img src="../assets/images/health/inspire-health-landing-placeholder.png" alt="Inspire Health & Wellbeing website design concept" />
  </figure>
</body>
</html>
