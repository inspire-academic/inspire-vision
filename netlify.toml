[build]
publish = "."
functions = "netlify/functions"

# Weekly mentor staleness digest — see the function's own header comment
# for what it does. Netlify does not allow scheduled functions to be
# invoked over public HTTP, only via this schedule.
[functions."notify-mentor-staleness"]
  schedule = "0 8 * * 1"

[context.production]
  branch = "main"

[context.staging]
  branch = "staging"

# Lords Consult "Idea to Impact" diagnostic tenant (Tenants/lords-consult/)
# — path-based hosting per BUILD-BRIEF.md section 2, option 2. Tenant key
# is "lords-consult" throughout the schema/functions even though the public
# URL says "partners" — see CLAUDE.md for the tenant-boundary rationale.
[[redirects]]
  from = "/partners/lords-consult"
  to = "/Tenants/lords-consult/index.html"
  status = 200

[[redirects]]
  from = "/partners/lords-consult/"
  to = "/Tenants/lords-consult/index.html"
  status = 200

[[redirects]]
  from = "/mentorship/dashboard"
  to = "/mentorship/dashboard/"
  status = 301

[[redirects]]
  from = "/mentorship/mentor-portal"
  to = "/mentorship/mentor-portal/"
  status = 301

# The old single-page Faith attempt (different, older navy/gold design
# system than the approved /faith/ module built 2026-09) was never
# linked from the homepage nav, but stayed live and reachable at its
# direct URL — which is exactly how three fake demo sermons/podcasts
# sat published and visible on it for months without anyone noticing.
# force=true is required here since the file itself still exists at
# this path — without it, Netlify serves the file instead of redirecting.
[[redirects]]
  from = "/pages/inspire-faith.html"
  to = "/faith/index.html"
  status = 301
  force = true

# Pink & Powerful (Brovelyn Childcare Services x Inspire Health & Wellbeing)
# — canonical route serves the page file without changing the URL; the two
# originally-requested URLs (raw "&" and percent-encoded "%26", plus the
# "Powerfull" misspelling) permanently redirect to the canonical route so
# any link already shared with that URL still works.
[[redirects]]
  from = "/Pink&PowerfullRegistration"
  to = "/pink-powerful-registration"
  status = 301
  force = true

[[redirects]]
  from = "/Pink%26PowerfullRegistration"
  to = "/pink-powerful-registration"
  status = 301
  force = true

[[redirects]]
  from = "/pink-powerful-registration"
  to = "/pages/pink-powerful-registration.html"
  status = 200

[[redirects]]
  from = "/admin/pink-powerful/registrations"
  to = "/admin/pink-powerful-registrations.html"
  status = 200
