<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffc93c">
<meta name="robots" content="noindex">
<title>Sign in — Bible Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/faith/children-service/css/kids.css">
<link rel="stylesheet" href="/faith/children-service/css/app.css">
</head>
<body class="app">
<div id="chrome-top"></div>
<main class="wrap"><div class="narrow" id="app">
  <h1>Grown-ups, sign in</h1>
  <p class="lede">Sign in to see your family and join class.</p>
  <form class="card" id="form" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="err" role="alert"></p>
    <p class="msg" id="info" role="status"></p>
    <button class="btn btn-sun" type="submit" id="go">Sign in</button>
    <p class="small muted spaced"><button type="button" class="linkbtn" id="forgot" style="padding:0;min-height:0;text-decoration:underline">Forgot your password?</button></p>
    <p class="small muted">New here? <a href="/faith/children-service/parent/join.html">Create a grown-up account</a></p>
  </form>
</div></main>
<div id="chrome-bottom"></div>
<script src="/assets/supabase.js"></script>
<script src="/faith/children-service/js/kids-config.js"></script>
<script src="/faith/children-service/js/kids-core.js"></script>
<script src="/faith/children-service/js/pages/parent-login.js"></script>
</body>
</html>
